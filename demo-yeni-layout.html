<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BudurBuldum — Yeni Layout Demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.page{width:100%;max-width:430px;min-height:100vh;background:#f8fafc;display:flex;flex-direction:column;position:relative;}

/* HEADER */
.bb-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0f172a;position:sticky;top:0;z-index:50;}
.bb-logo{font-family:Georgia,serif;font-size:18px;font-weight:900;color:#f1f5f9;letter-spacing:-0.5px;}
.bb-logo span{color:#e8a838;}
.bb-tagline{font-size:10px;color:#64748b;font-weight:600;letter-spacing:0.05em;}

/* ANA LAYOUT */
.bb-main{display:flex;flex:1;}

/* SOL SÜTUN — PİLL'LER */
.bb-left{width:76px;flex-shrink:0;background:#fff;border-right:1px solid #e2e8f0;padding:10px 6px;display:flex;flex-direction:column;gap:8px;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;}

.pill-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 8px;border-radius:12px;border:1.5px solid #e2e8f0;border-bottom:3px solid #cbd5e1;background:linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);cursor:pointer;transition:all 0.2s;position:relative;-webkit-tap-highlight-color:transparent;}
.pill-btn:active{transform:translateY(1px);}
.pill-btn.done{border-color:#10b981;border-bottom-color:#059669;background:linear-gradient(180deg,#f0fdf4 0%,#dcfce7 100%);}
.pill-btn.zorunlu:not(.done)::after{content:'*';position:absolute;top:3px;right:5px;color:#f59e0b;font-size:10px;font-weight:900;}
.pill-icon{font-size:20px;line-height:1;}
.pill-label{font-size:9px;color:#64748b;font-weight:700;text-align:center;line-height:1.2;letter-spacing:0.02em;}
.pill-btn.done .pill-label{color:#059669;}
.pill-check{position:absolute;top:4px;right:4px;width:14px;height:14px;background:#10b981;border-radius:50%;display:none;align-items:center;justify-content:center;}
.pill-btn.done .pill-check{display:flex;}
.pill-check i{color:white;font-size:8px;}

/* SAĞ — VİTRİN */
.bb-right{flex:1;display:flex;flex-direction:column;padding:12px 10px;gap:10px;overflow:hidden;}

.vitrin-header{display:flex;align-items:center;justify-content:space-between;}
.vitrin-label{font-size:9px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:0.1em;}
.vitrin-count{font-size:11px;font-weight:700;color:#e8a838;background:#fef3c7;padding:2px 8px;border-radius:20px;}

.vitrin-cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;transition:opacity 0.35s ease;}
.vitrin-cards.fading{opacity:0;}

.v-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;border-bottom:3px solid #cbd5e1;}
.v-card-img{height:62px;display:flex;align-items:center;justify-content:center;font-size:30px;}
.v-card-body{padding:6px 8px;}
.v-card-name{font-size:10px;font-weight:700;color:#1e293b;line-height:1.3;margin-bottom:2px;}
.v-card-price{font-size:12px;font-weight:800;color:#d97706;}

.vitrin-sub{font-size:12px;color:#64748b;text-align:center;padding:2px 4px;min-height:18px;transition:all 0.3s;}
.vitrin-sub b{color:#1e40af;}

/* HEDİYE BUL */
.hediye-bul-wrap{padding:0 2px;}
.hediye-bul-btn{width:100%;padding:15px;border-radius:14px;border:none;background:#94a3b8;color:#fff;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.25s;-webkit-tap-highlight-color:transparent;letter-spacing:0.01em;}
.hediye-bul-btn.hazir{background:linear-gradient(135deg,#1e40af 0%,#1e3a8a 100%);box-shadow:0 4px 20px rgba(30,64,175,0.4);animation:pulseBtn 2s ease-in-out infinite;}
@keyframes pulseBtn{0%,100%{box-shadow:0 4px 20px rgba(30,64,175,0.4);}50%{box-shadow:0 4px 28px rgba(30,64,175,0.65);}}
.hediye-bul-hint{text-align:center;font-size:10px;color:#94a3b8;margin-top:6px;font-weight:600;}

/* ZORUNLU NOT */
.zorunlu-not{font-size:9px;color:#94a3b8;text-align:center;padding-bottom:4px;}

/* POPUP */
.popup-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.6);display:none;align-items:flex-end;z-index:200;backdrop-filter:blur(2px);}
.popup-overlay.open{display:flex;}
.popup-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:430px;margin:0 auto;padding:20px 16px 36px;max-height:90vh;overflow-y:auto;}
.popup-drag{width:40px;height:4px;background:#e2e8f0;border-radius:2px;margin:0 auto 16px;}
.popup-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.popup-title{font-size:16px;font-weight:800;color:#1e293b;}
.popup-close{width:32px;height:32px;border-radius:50%;border:1.5px solid #e2e8f0;background:#f8fafc;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:#64748b;-webkit-tap-highlight-color:transparent;}

/* POPUP MİNİ VİTRİN */
.popup-mini-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px;}
.pm-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;}
.pm-img{height:46px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.pm-name{font-size:8px;color:#64748b;font-weight:600;padding:4px 5px;line-height:1.3;text-align:center;}

/* POPUP SEÇENEKLER */
.popup-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.popup-opts.tek-sutun{grid-template-columns:1fr;}
.opt-btn{padding:11px 10px;border-radius:12px;border:1.5px solid #e2e8f0;border-bottom:3px solid #cbd5e1;background:linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);font-size:13px;font-weight:600;color:#1e293b;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 0.15s;-webkit-tap-highlight-color:transparent;}
.opt-btn:active{transform:translateY(1px);}
.opt-btn.selected{border-color:#10b981;border-bottom-color:#059669;background:linear-gradient(180deg,#f0fdf4 0%,#dcfce7 100%);color:#065f46;}
.opt-emoji{font-size:18px;flex-shrink:0;}

/* 3'lü grid için burç */
.popup-opts.uc-sutun{grid-template-columns:1fr 1fr 1fr;}
.popup-opts.uc-sutun .opt-btn{padding:10px 6px;font-size:11px;flex-direction:column;gap:3px;text-align:center;justify-content:center;}
.popup-opts.uc-sutun .opt-emoji{font-size:20px;}
</style>

  var d = vitrinDataByKime[kime];
  if(!d) return;
  var grid = document.getElementById('vitrinCards');
  grid.classList.add('fading');
  setTimeout(function(){
    grid.innerHTML = d.cards.map(function(c){
      return '<div class="v-card"><div class="v-card-img" style="background:'+c.bg+';">'+c.e+'</div><div class="v-card-body"><div class="v-card-name">'+c.n+'</div><div class="v-card-price">'+c.p+'</div></div></div>';
    }).join('');
    grid.classList.remove('fading');
  }, 200);
  document.getElementById('vitrinCount').textContent = d.count+' hediye';
  document.getElementById('vitrinSub').innerHTML = d.sub+' <b>'+d.count+' hediye</b> bulduk';
}

function openPopup(key) {
  activeKey = key;
  var d = DATA[key];
  document.getElementById('popupTitle').textContent = d.title;

  // Mini vitrin
  var miniList = Array.isArray(d.mini) ? d.mini : (d.mini[state[key]] || d.mini['Anne'] || []);
  var mini = document.getElementById('popupMiniCards');
  mini.innerHTML = miniList.map(function(m){
    return '<div class="pm-card"><div class="pm-img" style="background:'+m.bg+';">'+m.e+'</div><div class="pm-name">'+m.t+'</div></div>';
  }).join('');

  // Seçenekler
  var opts = document.getElementById('popupOpts');
  var gridClass = d.grid==='tek' ? 'popup-opts tek-sutun' : d.grid==='uc' ? 'popup-opts uc-sutun' : 'popup-opts';
  opts.className = gridClass;
  opts.innerHTML = d.opts.map(function(o){
    var sel = state[key]===o.l ? ' selected' : '';
    var full = o.full ? ' style="grid-column:1/-1;"' : '';
    return '<button class="opt-btn'+sel+'"'+full+' onclick="selectOpt(\''+o.l+'\')"><span class="opt-emoji">'+o.e+'</span>'+o.l+'</button>';
  }).join('');

  document.getElementById('popupOverlay').classList.add('open');
}

function selectOpt(val) {
  state[activeKey] = val;
  var pillBtn = document.getElementById('pill-'+activeKey);
  if(pillBtn) pillBtn.classList.add('done');
  var iconEl = document.getElementById('pill-'+activeKey+'-icon');
  if(iconEl) {
    var d = DATA[activeKey];
    var found = d.opts.filter(function(o){return o.l===val;})[0];
    if(found) iconEl.textContent = found.e;
  }
  if(activeKey==='kime') updateVitrin(val);
  document.querySelectorAll('.opt-btn').forEach(function(b){b.classList.remove('selected');});
  event.currentTarget.classList.add('selected');
  setTimeout(closePopup, 320);
  checkReady();
}

function checkReady() {
  var zorunlu = ['kime','yas','cinsiyet','amac','butce'];
  var dolu = zorunlu.filter(function(k){return state[k];}).length;
  var btn = document.getElementById('hediyeBulBtn');
  var hint = document.getElementById('hediyeBulHint');
  var eksik = zorunlu.filter(function(k){return !state[k];});
  if(dolu>=5){
    btn.disabled=false; btn.classList.add('hazir');
    hint.textContent = 'Hazır! 🎉 Hediyeleri görmek için bas';
    hint.style.color='#10b981';
  } else {
    btn.disabled=true; btn.classList.remove('hazir');
    var eksikIsimler = {kime:'Kime',yas:'Yaş',cinsiyet:'Cinsiyet',amac:'Neden',butce:'Bütçe'};
    hint.textContent = eksik.map(function(k){return eksikIsimler[k];}).join(', ')+' seçince hazır';
    hint.style.color='#94a3b8';
  }
}

function hediyeBul(){
  alert('Demo modunda! Gerçek entegrasyon sonra gelecek 🎁');
}

function overlayClick(e){if(e.target===document.getElementById('popupOverlay')) closePopup();}
function closePopup(){document.getElementById('popupOverlay').classList.remove('open');}

// Başlangıçta kime=Anne seçili göster
updateVitrin('Anne');
checkReady();
</script>
