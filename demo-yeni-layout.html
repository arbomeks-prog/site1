<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BudurBuldum</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#000;display:flex;justify-content:center;min-height:100vh;}
.page{width:100%;max-width:430px;min-height:100vh;position:relative;overflow:hidden;}

/* TAM EKRAN GÖRSEL */
.bg-img{position:fixed;inset:0;width:100%;max-width:430px;left:50%;transform:translateX(-50%);height:100%;object-fit:cover;transition:opacity 1.4s ease;z-index:0;}
.bg-img.gecis{opacity:0;}
.overlay{position:fixed;inset:0;max-width:430px;left:50%;transform:translateX(-50%);z-index:1;background:linear-gradient(to right, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.35) 100%);}
.overlay-alt{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;height:220px;background:linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);z-index:1;}

/* HEADER */
.bb-header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;}
.bb-logo{font-family:Georgia,serif;font-size:17px;font-weight:900;color:#fff;letter-spacing:-0.5px;text-shadow:0 1px 4px rgba(0,0,0,0.4);}
.bb-logo span{color:#e8a838;}
.bb-tagline{font-size:10px;color:rgba(255,255,255,0.45);letter-spacing:0.08em;}

/* SOL PİLL'LER — görselin üstünde */
.bb-left{position:fixed;left:0;top:52px;bottom:110px;z-index:10;padding:0 8px;display:flex;flex-direction:column;justify-content:space-evenly;width:100px;}
.pill-btn{display:flex;align-items:center;justify-content:center;padding:11px 8px;border-radius:10px;border:2px solid rgba(255,255,255,0.2);border-bottom:4px solid rgba(0,0,0,0.3);background:linear-gradient(180deg,rgba(30,30,30,0.55) 0%,rgba(10,10,10,0.45) 100%);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all 0.2s;width:100%;backdrop-filter:blur(12px);position:relative;overflow:hidden;}
.pill-btn:active{transform:translateY(2px);border-bottom-width:2px;}
.pill-btn.done{border-color:rgba(16,185,129,0.7);border-bottom-color:rgba(5,150,105,0.9);background:linear-gradient(180deg,rgba(16,185,129,0.3) 0%,rgba(5,150,105,0.2) 100%);}
.pill-btn.bekliyor{animation:cerceveParlama 1.6s ease-in-out infinite;}
@keyframes cerceveParlama{
  0%,100%{border-color:rgba(255,255,255,0.2);box-shadow:none;}
  50%{border-color:rgba(232,168,56,0.9);box-shadow:0 0 0 2px rgba(232,168,56,0.3),0 0 12px rgba(232,168,56,0.4);}
}
.pill-icon{display:none;}
.pill-label{font-size:13px;color:#fff;font-weight:800;text-align:center;letter-spacing:0.04em;text-shadow:0 2px 6px rgba(0,0,0,0.8);line-height:1;}
.pill-btn.done .pill-label{color:#6ee7b7;}
.pill-btn.zorunlu:not(.done) .pill-label{color:rgba(255,255,255,0.85);}

/* ALT KISIM — buton ve tur */
.alt-kisim{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:10;padding:0 16px 36px;}
.tur-gosterge{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;}
.tur-no{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;font-weight:600;}
.tur-cerceve{display:flex;gap:5px;}
.tur-kutu{width:22px;height:3px;background:rgba(255,255,255,0.2);border-radius:1px;}
.tur-kutu.aktif{background:#e8a838;}
.hediye-bul-btn{width:100%;padding:16px;border:none;background:#fff;color:#0f172a;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:0.02em;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.3s;-webkit-tap-highlight-color:transparent;}
.hediye-bul-btn.pasif{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.35);cursor:default;backdrop-filter:blur(4px);}
.hediye-bul-btn.hazir{background:#fff;color:#0f172a;}
.hediye-bul-hint{text-align:center;font-size:10px;color:rgba(255,255,255,0.35);margin-top:8px;letter-spacing:0.05em;}
.hediye-bul-hint.hazir{color:rgba(255,255,255,0.7);}

/* KARTLAR EKRANI */
.kartlar-ekran{position:fixed;inset:0;max-width:430px;left:50%;transform:translateX(-50%);background:#fff;z-index:50;display:none;flex-direction:column;overflow-y:auto;}
.kartlar-ekran.acik{display:flex;}
.kartlar-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid #f1f5f9;position:sticky;top:0;background:#fff;z-index:5;}
.kartlar-logo{font-family:Georgia,serif;font-size:16px;font-weight:900;color:#0f172a;}
.kartlar-logo span{color:#e8a838;}
.kartlar-geri{font-size:11px;color:#94a3b8;cursor:pointer;display:flex;align-items:center;gap:5px;letter-spacing:0.03em;}
.kartlar-icerik{padding:16px;}
.kartlar-baslik{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:4px;}
.kartlar-alt{font-size:11px;color:#94a3b8;margin-bottom:16px;}
.kartlar-grid{display:flex;flex-direction:column;gap:24px;}

/* HEDIYE KART */
.gift-card{background:#fff;}
.star-badge{display:inline-block;background:#f59e0b;color:#fff;font-size:9px;font-weight:700;padding:3px 8px;margin-bottom:8px;letter-spacing:0.06em;}
.gift-card-img{width:100%;height:190px;object-fit:cover;display:block;opacity:0;transition:opacity 0.5s;}
.gift-card-img.loaded{opacity:1;}
.gift-card-body{padding:10px 0 0;}
.gift-card-ad{font-size:14px;font-weight:700;color:#0f172a;margin-bottom:3px;}
.gift-card-fiyat{font-size:16px;font-weight:800;color:#d97706;}
.gift-card-fiyat-label{font-size:9px;color:#94a3b8;font-weight:600;margin-left:5px;letter-spacing:0.05em;}
.gift-card-alt{display:flex;gap:14px;margin:6px 0;}
.gift-card-alt span{font-size:10px;color:#cbd5e1;cursor:pointer;}
.gift-card-reason{font-size:11px;color:#3b82f6;font-style:italic;margin:4px 0;line-height:1.4;}
.gift-card-desc{font-size:11px;color:#64748b;margin-bottom:8px;line-height:1.5;}
.gift-card-platforms{display:flex;gap:3px;flex-wrap:wrap;}
.plt-link{font-size:9px;font-weight:700;padding:5px 8px;cursor:pointer;letter-spacing:0.02em;}
.plt-trendyol{background:#f27a1a;color:#fff;}
.plt-hepsiburada{background:#ff6000;color:#fff;}
.plt-amazon{background:#ff9900;color:#0f172a;}
.plt-ciceksepeti{background:#e91e8c;color:#fff;}
.plt-n11{background:#6f2da8;color:#fff;}

/* POPUP — koyu, VIP */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:flex-end;z-index:200;backdrop-filter:blur(6px);}
.popup-overlay.open{display:flex;}
.popup-box{background:linear-gradient(180deg,#1a1a2e 0%,#0f0f1a 100%);width:100%;max-width:430px;margin:0 auto;padding:24px 16px 48px;max-height:88vh;overflow-y:auto;border-top:1px solid rgba(255,255,255,0.08);}
.popup-drag{width:32px;height:3px;background:rgba(255,255,255,0.15);margin:0 auto 20px;border-radius:2px;}
.popup-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.popup-title{font-size:16px;font-weight:800;color:#fff;letter-spacing:0.02em;}
.popup-close{width:28px;height:28px;border:none;background:transparent;cursor:pointer;font-size:16px;color:rgba(255,255,255,0.4);}
.popup-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.popup-opts.tek{grid-template-columns:1fr;}
.popup-opts.uc{grid-template-columns:1fr 1fr 1fr;}
.opt-btn{padding:16px 12px;border:2px solid rgba(255,255,255,0.22);border-bottom:4px solid rgba(0,0,0,0.3);background:linear-gradient(180deg,rgba(255,255,255,0.18) 0%,rgba(255,255,255,0.08) 100%);font-size:14px;font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;-webkit-tap-highlight-color:transparent;transition:all 0.15s;border-radius:10px;backdrop-filter:blur(10px);letter-spacing:0.02em;}
.opt-btn:active{transform:translateY(2px);border-bottom-width:2px;}
.opt-btn.selected{border-color:rgba(232,168,56,0.9);border-bottom-color:rgba(160,100,10,0.9);background:linear-gradient(180deg,rgba(232,168,56,0.3) 0%,rgba(180,120,20,0.2) 100%);color:#e8a838;}
.opt-emoji{display:none;}
.popup-opts.uc .opt-btn{padding:14px 6px;font-size:12px;}
</style>
</head>
<body>
<div class="page">

  <!-- ARKA PLAN GÖRSELLERİ -->
  <img class="bg-img" id="bgImg0" src="https://images.pexels.com/photos/3585088/pexels-photo-3585088.jpeg?auto=compress&cs=tinysrgb&w=800" alt="">
  <img class="bg-img gecis" id="bgImg1" src="" alt="">
  <div class="overlay"></div>
  <div class="overlay-alt"></div>

  <!-- HEADER -->
  <div class="bb-header">
    <div class="bb-logo">budur<span>buldum</span></div>
    <div class="bb-tagline">ÜCRETSİZ · ÜYELİKSİZ</div>
  </div>

  <!-- SOL PİLL'LER -->
  <div class="bb-left">
    <div class="pill-btn zorunlu" id="pill-kime" onclick="openPopup('kime')">
      <div class="pill-icon" id="icon-kime">🎁</div>
      <div class="pill-label">kime</div>
    </div>
    <div class="pill-btn zorunlu" id="pill-yas" onclick="openPopup('yas')">
      <div class="pill-icon" id="icon-yas">🎂</div>
      <div class="pill-label">yaşı</div>
    </div>
    <div class="pill-btn zorunlu" id="pill-cinsiyet" onclick="openPopup('cinsiyet')">
      <div class="pill-icon" id="icon-cinsiyet">👤</div>
      <div class="pill-label">cinsiyet</div>
    </div>
    <div class="pill-btn zorunlu" id="pill-amac" onclick="openPopup('amac')">
      <div class="pill-icon" id="icon-amac">🎀</div>
      <div class="pill-label">neden</div>
    </div>
    <div class="pill-btn zorunlu" id="pill-butce" onclick="openPopup('butce')">
      <div class="pill-icon" id="icon-butce">💰</div>
      <div class="pill-label">bütçe</div>
    </div>
    <div class="pill-btn" id="pill-hobi" onclick="openPopup('hobi')">
      <div class="pill-icon" id="icon-hobi">🏃</div>
      <div class="pill-label">hobi</div>
    </div>
    <div class="pill-btn" id="pill-burc" onclick="openPopup('burc')">
      <div class="pill-icon" id="icon-burc">⭐</div>
      <div class="pill-label">burcu</div>
    </div>
  </div>

  <!-- ALT BUTON + TUR -->
  <div class="alt-kisim">
    <div class="tur-gosterge">
      <span class="tur-no">TUR</span>
      <div class="tur-cerceve">
        <div class="tur-kutu aktif" id="tur1"></div>
        <div class="tur-kutu" id="tur2"></div>
        <div class="tur-kutu" id="tur3"></div>
      </div>
    </div>
    <button class="hediye-bul-btn pasif" id="hediyeBulBtn" onclick="hediyeBul()">
      hediye bul
    </button>
    <div class="hediye-bul-hint" id="hediyeBulHint">kime · yaş · cinsiyet · neden · bütçe</div>
  </div>

  <!-- KARTLAR EKRANI -->
  <div class="kartlar-ekran" id="kartlarEkran">
    <div class="kartlar-header">
      <div class="kartlar-logo">budur<span>buldum</span></div>
      <div class="kartlar-geri" onclick="geriDon()">← geri dön</div>
    </div>
    <div class="kartlar-icerik">
      <div class="kartlar-baslik" id="kartlarBaslik">kişiye özel hediyeler</div>
      <div class="kartlar-alt" id="kartlarAlt">1. tur · 4 nokta atışı + 5 kişiye özel</div>
      <div class="kartlar-grid" id="kartlarGrid"></div>
    </div>
  </div>

</div>

<!-- POPUP -->
<div class="popup-overlay" id="popupOverlay" onclick="overlayClick(event)">
  <div class="popup-box">
    <div class="popup-drag"></div>
    <div class="popup-top">
      <div class="popup-title" id="popupTitle"></div>
      <button class="popup-close" onclick="closePopup()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="popup-opts" id="popupOpts"></div>
  </div>
</div>

<script>
var state={kime:null,yas:null,cinsiyet:null,amac:null,butce:null,hobi:null,burc:null};
var activeKey=null;
var turNo=1;
var sliderTimer=null;
var aktifBg=0;

var GORSELLER={
  genel:['https://images.pexels.com/photos/3585088/pexels-photo-3585088.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/6479601/pexels-photo-6479601.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/5490276/pexels-photo-5490276.jpeg?auto=compress&cs=tinysrgb&w=800'],
  Anne:['https://images.pexels.com/photos/4260325/pexels-photo-4260325.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/3807571/pexels-photo-3807571.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/5490278/pexels-photo-5490278.jpeg?auto=compress&cs=tinysrgb&w=800'],
  Baba:['https://images.pexels.com/photos/2379005/pexels-photo-2379005.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/1222271/pexels-photo-1222271.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=800'],
  Sevgili:['https://images.pexels.com/photos/3585798/pexels-photo-3585798.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/1024975/pexels-photo-1024975.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/6479617/pexels-photo-6479617.jpeg?auto=compress&cs=tinysrgb&w=800'],
  Arkadaş:['https://images.pexels.com/photos/3171837/pexels-photo-3171837.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/1756615/pexels-photo-1756615.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/6479583/pexels-photo-6479583.jpeg?auto=compress&cs=tinysrgb&w=800'],
  Eşim:['https://images.pexels.com/photos/3585798/pexels-photo-3585798.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/5490276/pexels-photo-5490276.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/1024975/pexels-photo-1024975.jpeg?auto=compress&cs=tinysrgb&w=800'],
  Kardeş:['https://images.pexels.com/photos/1756615/pexels-photo-1756615.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/3171837/pexels-photo-3171837.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/6479601/pexels-photo-6479601.jpeg?auto=compress&cs=tinysrgb&w=800'],
  Çocuk:['https://images.pexels.com/photos/3662667/pexels-photo-3662667.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/35537/child-children-girl-happy.jpg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/1648387/pexels-photo-1648387.jpeg?auto=compress&cs=tinysrgb&w=800'],
  Pet:['https://images.pexels.com/photos/1805164/pexels-photo-1805164.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/1108099/pexels-photo-1108099.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/2253275/pexels-photo-2253275.jpeg?auto=compress&cs=tinysrgb&w=800'],
  Kendime:['https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/4260325/pexels-photo-4260325.jpeg?auto=compress&cs=tinysrgb&w=800','https://images.pexels.com/photos/3997993/pexels-photo-3997993.jpeg?auto=compress&cs=tinysrgb&w=800']
};

var mevcutListe=GORSELLER.genel;
var mevcutIdx=0;

function gorselGec(url){
  var aktif=document.getElementById('bgImg'+aktifBg);
  var diger=document.getElementById('bgImg'+(aktifBg===0?1:0));
  diger.src=url;
  diger.classList.remove('gecis');
  aktif.classList.add('gecis');
  aktifBg=aktifBg===0?1:0;
}

function sliderBaslat(liste){
  mevcutListe=liste;
  mevcutIdx=0;
  gorselGec(liste[0]);
  if(sliderTimer) clearInterval(sliderTimer);
  sliderTimer=setInterval(function(){
    mevcutIdx=(mevcutIdx+1)%mevcutListe.length;
    gorselGec(mevcutListe[mevcutIdx]);
  },3800);
}

sliderBaslat(GORSELLER.genel);

var PLT_CSS={trendyol:'plt-trendyol',hepsiburada:'plt-hepsiburada',amazon:'plt-amazon',ciceksepeti:'plt-ciceksepeti',n11:'plt-n11'};
var PLT_LABEL={trendyol:'Trendyol',hepsiburada:'Hepsiburada',amazon:'Amazon',ciceksepeti:'Çiçeksepeti',n11:'N11'};

var DEMO_KARTLAR=[
  {star:true,ad:'🌸 Çiçek Aranjmanı',fiyat:'320 TL',reason:'"annenizi mutlu edecek en güzel seçimlerden biri"',desc:'taze mevsim çiçeklerinden hazırlanan özel aranjman. aynı gün teslimat mevcut.',img:'https://images.pexels.com/photos/931177/pexels-photo-931177.jpeg?auto=compress&cs=tinysrgb&w=600',platforms:['trendyol','ciceksepeti']},
  {star:true,ad:'🧴 Cilt Bakım Seti',fiyat:'450 TL',reason:'"anneye özel bir şımarma seti"',desc:'premium markalardan oluşan bakım seti. nemlendirici, serum ve yüz maskesi içerir.',img:'https://images.pexels.com/photos/3762875/pexels-photo-3762875.jpeg?auto=compress&cs=tinysrgb&w=600',platforms:['trendyol','hepsiburada']},
  {star:false,ad:'📚 Kitap Seti',fiyat:'280 TL',reason:'"saatlerce keyif verecek seçimler"',desc:'yazar seçimine göre kişiselleştirilebilir 3 kitaplık set.',img:'https://images.pexels.com/photos/1130980/pexels-photo-1130980.jpeg?auto=compress&cs=tinysrgb&w=600',platforms:['amazon','n11']},
  {star:false,ad:'☕ Kahve & Çay Seti',fiyat:'390 TL',reason:'"her sabah sizi hatırlasın"',desc:'özel harman kahveler ve çaylardan oluşan premium ikram seti.',img:'https://images.pexels.com/photos/312418/pexels-photo-312418.jpeg?auto=compress&cs=tinysrgb&w=600',platforms:['trendyol','hepsiburada']}
];

function hediyeBul(){
  if(!document.getElementById('hediyeBulBtn').classList.contains('hazir')) return;
  if(sliderTimer) clearInterval(sliderTimer);
  var grid=document.getElementById('kartlarGrid');
  grid.innerHTML=DEMO_KARTLAR.map(function(c,i){
    var h='<div class="gift-card">';
    if(c.star) h+='<div class="star-badge">🎯 NOKTA ATIŞI</div>';
    h+='<img class="gift-card-img" id="gci'+i+'" src="" alt="">';
    h+='<div class="gift-card-body">';
    h+='<div class="gift-card-ad">'+c.ad+'</div>';
    h+='<div><span class="gift-card-fiyat">'+c.fiyat+'</span><span class="gift-card-fiyat-label">ORTALAMA FİYAT</span></div>';
    h+='<div class="gift-card-alt"><span>⭐ puan ver</span><span>✉️ bize yaz</span><span>📸 indir</span></div>';
    h+='<div class="gift-card-reason">'+c.reason+'</div>';
    h+='<div class="gift-card-desc">'+c.desc+'</div>';
    h+='<div class="gift-card-platforms">'+c.platforms.map(function(p){return '<span class="plt-link '+PLT_CSS[p]+'">'+PLT_LABEL[p]+'</span>';}).join('')+'</div>';
    h+='</div></div>';
    return h;
  }).join('');
  DEMO_KARTLAR.forEach(function(c,i){
    var img=document.getElementById('gci'+i);
    if(img){img.onload=function(){img.classList.add('loaded');};img.src=c.img;}
  });
  turGuncelle();
  document.getElementById('kartlarEkran').classList.add('acik');
}

function turGuncelle(){
  [1,2,3].forEach(function(n){
    var el=document.getElementById('tur'+n);
    if(el) el.classList.toggle('aktif',n<=turNo);
  });
}

function geriDon(){
  document.getElementById('kartlarEkran').classList.remove('acik');
  sliderBaslat(GORSELLER[state.kime]||GORSELLER.genel);
  turNo=Math.min(turNo+1,3);
  turGuncelle();
  var btn=document.getElementById('hediyeBulBtn');
  btn.textContent=turNo+'. tur — yeni hediyeler bul';
}

var DATA={
  kime:{title:'kime alıyorsunuz?',grid:'iki',opts:[{e:'👩',l:'Anne'},{e:'👨',l:'Baba'},{e:'💏',l:'Sevgili'},{e:'🤝',l:'Arkadaş'},{e:'👫',l:'Eşim'},{e:'👧🧒',l:'Kardeş'},{e:'🧒',l:'Çocuk'},{e:'🐾',l:'Pet'},{e:'🪞',l:'Kendime',full:true}]},
  yas:{title:'kaç yaşında?',grid:'iki',opts:[{e:'🧒',l:'13–17'},{e:'🎓',l:'18–25'},{e:'☕',l:'26–35'},{e:'🏡',l:'36–45'},{e:'🌿',l:'46–60'},{e:'🍵',l:'61+'}]},
  cinsiyet:{title:'cinsiyeti nedir?',grid:'tek',opts:[{e:'👩',l:'Kadın'},{e:'👨',l:'Erkek'}]},
  amac:{title:'neden alıyorsunuz?',grid:'iki',opts:[{e:'🎂',l:'Doğum Günü'},{e:'💐',l:'Yıl Dönümü'},{e:'❤️',l:'Sevgililer Günü'},{e:'🏆',l:'Özel Başarı'},{e:'🎁',l:'Sadece Sürpriz'},{e:'🎊',l:'Yılbaşı / Bayram'}]},
  butce:{title:'bütçeniz ne kadar?',grid:'iki',opts:[{e:'💛',l:'0–500 TL'},{e:'💚',l:'0–1.000 TL'},{e:'💙',l:'0–2.000 TL'},{e:'💜',l:'0–3.000 TL'},{e:'🖤',l:'0–5.000 TL'},{e:'💎',l:'5.000+ TL'}]},
  hobi:{title:'hobisi var mı?',grid:'iki',opts:[{e:'🏃',l:'Spor'},{e:'🎵',l:'Müzik'},{e:'📚',l:'Kitap'},{e:'☕',l:'Kahve & Çay'},{e:'💻',l:'Teknoloji'},{e:'🍳',l:'Yemek'},{e:'✈️',l:'Seyahat'},{e:'🎨',l:'Sanat'}]},
  burc:{title:'burcu nedir?',grid:'uc',opts:[{e:'♈',l:'Koç'},{e:'♉',l:'Boğa'},{e:'♊',l:'İkizler'},{e:'♋',l:'Yengeç'},{e:'♌',l:'Aslan'},{e:'♍',l:'Başak'},{e:'♎',l:'Terazi'},{e:'♏',l:'Akrep'},{e:'♐',l:'Yay'},{e:'♑',l:'Oğlak'},{e:'♒',l:'Kova'},{e:'♓',l:'Balık'},{e:'🤷',l:'Bilmiyorum',full:true}]}
};

function openPopup(key){
  activeKey=key;
  var d=DATA[key];
  document.getElementById('popupTitle').textContent=d.title;
  var opts=document.getElementById('popupOpts');
  opts.className='popup-opts'+(d.grid==='tek'?' tek':d.grid==='uc'?' uc':'');
  opts.innerHTML=d.opts.map(function(o){
    var sel=state[key]===o.l?' selected':'';
    var full=o.full?' style="grid-column:1/-1;"':'';
    return '<button class="opt-btn'+sel+'"'+full+' onclick="selectOpt(\''+o.l.replace(/'/g,"\\'")+'\')"><span class="opt-emoji">'+o.e+'</span>'+o.l+'</button>';
  }).join('');
  document.getElementById('popupOverlay').classList.add('open');
}

var SIRALAMA=['kime','yas','cinsiyet','amac','butce','hobi','burc'];

function bekleyenGuncelle(){
  // Tüm bekliyor sınıfını kaldır
  SIRALAMA.forEach(function(k){
    document.getElementById('pill-'+k).classList.remove('bekliyor');
  });
  // Seçilmemiş ilk zorunluya bekliyor ver
  var zorunlu=['kime','yas','cinsiyet','amac','butce'];
  var ilk=zorunlu.filter(function(k){return !state[k];})[0];
  if(ilk) document.getElementById('pill-'+ilk).classList.add('bekliyor');
}

function selectOpt(val){
  state[activeKey]=val;
  var pill=document.getElementById('pill-'+activeKey);
  pill.classList.add('done');
  pill.classList.remove('bekliyor');
  var found=DATA[activeKey].opts.filter(function(o){return o.l===val;})[0];
  if(found) document.getElementById('icon-'+activeKey).textContent=found.e;
  if(activeKey==='kime') sliderBaslat(GORSELLER[val]||GORSELLER.genel);
  document.querySelectorAll('.opt-btn').forEach(function(b){b.classList.remove('selected');});
  event.currentTarget.classList.add('selected');
  setTimeout(closePopup,280);
  checkReady();
  bekleyenGuncelle();
}

function checkReady(){
  var zorunlu=['kime','yas','cinsiyet','amac','butce'];
  var eksik=zorunlu.filter(function(k){return !state[k];});
  var btn=document.getElementById('hediyeBulBtn');
  var hint=document.getElementById('hediyeBulHint');
  if(eksik.length===0){
    btn.classList.remove('pasif');btn.classList.add('hazir');
    hint.textContent='hazır — hediyeleri görmek için bas';
    hint.classList.add('hazir');
  } else {
    btn.classList.add('pasif');btn.classList.remove('hazir');
    var isim={kime:'kime',yas:'yaş',cinsiyet:'cinsiyet',amac:'neden',butce:'bütçe'};
    hint.textContent=eksik.map(function(k){return isim[k];}).join(' · ');
    hint.classList.remove('hazir');
  }
}

function overlayClick(e){if(e.target===document.getElementById('popupOverlay'))closePopup();}
function closePopup(){document.getElementById('popupOverlay').classList.remove('open');}
// Başlangıçta ilk butona animasyon
document.getElementById('pill-kime').classList.add('bekliyor');
</script>
